name: Build Fabric Mod

# Trigger workflow on push or PR to master, plus manual run
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:  # manual trigger

jobs:
  build:
    name: Build Retry Mod
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Make Gradle wrapper executable
      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # 4️⃣ Build the mod using Gradle
      - name: Build mod
        run: ./gradlew build

      # 5️⃣ Upload the built .jar as an artifact
      - name: Upload mod artifact
        uses: actions/upload-artifact@v3
        with:
          name: RetryMod
          path: build/libs/*.jar
