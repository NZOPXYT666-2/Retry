name: Build Fabric Mod

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Make gradlew executable
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 4️⃣ Build mod
      - name: Build mod
        run: ./gradlew build

      # 5️⃣ Upload artifact (v4 only!)
      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: RetryMod
          path: build/libs/*.jar
