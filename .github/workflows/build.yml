name: Build Fabric Mod

# Trigger on push or pull request to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Retry Mod
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # Step 2: Set up Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: temurin
        java-version: 17

    # Step 3: Make gradlew executable
    - name: Grant gradlew execute permission
      run: chmod +x gradlew

    # Step 4: Build the mod using Gradle
    - name: Build mod
      run: ./gradlew build

    # Step 5: Upload the built .jar as an artifact
    - name: Upload mod artifact
      uses: actions/upload-artifact@v3
      with:
        name: RetryMod
        path: build/libs/*.jar
