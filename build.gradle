plugins {
    id 'fabric-loom' version '1.2.16'
    id 'maven-publish'
    id 'gradle-build-utils' version '1.7.0'
}

// Removed dependency on missing publish.properties, hardcode values
version = "1.0.0+1.21.8"
group = "com.enzomodkit"
archivesBaseName = "retry"

repositories {
    mavenCentral()
    maven { url "https://repo.lclpnet.work/repository/internal" }
}

loom {
    // Keep your split environment source sets
    splitEnvironmentSourceSets()

    mods {
        "retry" { // your mod id
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}
